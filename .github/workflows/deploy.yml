name: Deploy to cPanel

# WHY THIS RUNS ON GITHUB RATHER THAN BEING UPLOADED BY HAND
#
# The target host has no SSH and no Terminal, so anything the server needs must arrive as
# finished files. Building here means the artifacts are produced on Linux by a recorded,
# repeatable process, rather than being whatever happened to be on somebody's Windows PC that
# day — which is how a deploy quietly ships a half-built frontend.
#
# It also makes `vendor/` and `public/build` non-issues: both are gitignored, so a plain clone
# on the server would give source code and a broken application.

on:
  # Deploys only from main, and only after the CI workflow is green on that commit.
  push:
    branches: [main]

  # Lets you redeploy without an empty commit, if a transfer fails halfway.
  workflow_dispatch:

# Two pushes in quick succession must not race, or they interleave transfers and leave a
# mixture of both revisions on the server. The older run is cancelled; the newer one wins.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Only ever deploy the branch that is production.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Wait for CI on this commit.
      #
      # Deploying before the tests pass puts a broken commit in front of staff, and this
      # application's failures are silent: a wrong total, a photograph that never appears, a
      # clock-out recorded at the wrong time. None of them raise anything anybody would see.
      # So the deploy refuses to start until CI is green on this exact commit.
      # ---------------------------------------------------------------
      - name: Wait for tests to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          # Generous: the suite runs twice, once per database driver, plus the migration job.
          allowed-conclusions: success
          verbose: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Only what the APPLICATION needs at runtime. Deliberately no `gd`: it is used by the
          # PWA icon generator, which is a local script and not part of a deploy.
          extensions: mbstring, intl, pdo_mysql, curl, zip, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------------------
      # Sanity checks, before anything is transferred.
      #
      # If the build silently produced nothing, the deploy would still "succeed" and the site
      # would render a blank page — because the Blade views load their assets through @vite and
      # a missing manifest is not a build error. Asserting it here makes the failure cheap and
      # the message clear, instead of it surfacing as a white screen on the live site.
      # ---------------------------------------------------------------
      - name: Verify the artifacts exist
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "::error::public/build/manifest.json is missing — the frontend did not build, and the site would render blank."
            exit 1
          fi

          if [ ! -f vendor/autoload.php ]; then
            echo "::error::vendor/autoload.php is missing — the application would fatal on the first request."
            exit 1
          fi

          echo "Build manifest present; $(find public/build -type f | wc -l) asset(s)."
          echo "vendor present; $(find vendor -type f | wc -l) file(s)."

      # ---------------------------------------------------------------
      # Package `vendor/` into ONE archive.
      #
      # `vendor/` is a BUILD ARTIFACT, not source — Composer generates it from `composer.lock`
      # — and it is 9,919 of the ~10,000 files in a deploy. Shipping it as one archive turns
      # ~10,000 transfers into roughly 250.
      #
      # HONEST NOTE ON WHY THIS EXISTS. The first real upload moved 8,599 individual files and
      # died with a TLS error. I first read that as DURATION — 2.3 files/second against a
      # server that drops idle connections — and recorded here that the archive was the fix.
      # That was WRONG, and the next run proved it: with the archive in place the transfer
      # shrank to ~250 files and it failed anyway, in 4 minutes instead of 62. Duration was
      # never the cause; the archive is still worth keeping because it is far faster and
      # far less likely to be interrupted, but it did NOT fix the failure. The real cause is
      # on the data socket — see the note above `Deploy over FTP`.
      #
      # `-q` because the file list runs to thousands of lines and would bury everything else in
      # the log. The archive contains the `vendor/` directory itself, so extracting it at the
      # application root lands the files correctly without creating a folder first — one fewer
      # step to get wrong.
      # ---------------------------------------------------------------
      - name: Package vendor
        run: |
          zip -qr vendor.zip vendor -x 'vendor/composer/tmp-*'
          echo "vendor.zip: $(du -h vendor.zip | cut -f1), $(unzip -l vendor.zip | tail -1 | awk '{print $2}') entries"

      # ---------------------------------------------------------------
      # Upload.
      #
      # PLAIN FTP, DELIBERATELY — NOT FTPS. This is a retreat, and here is why it is the
      # right one.
      #
      # WHAT ACTUALLY FAILS. The host offers explicit FTPS (Pure-FTPd, `AUTH TLS` on port 21)
      # and the control connection works over TLS: it authenticates and it lists the remote
      # tree. The failure is on the TLS DATA socket, during the file transfer:
      #
      #   SSL alert number 50 (data socket)
      #
      # EVIDENCE THAT IT IS NOT SIZE OR SPEED. The first real upload moved 8,599 files and
      # failed after 62 minutes. It was then reduced to ~250 files and one 15 MB archive —
      # and it failed in 4 MINUTES with the identical error. The rehearsal (dry-run) of the
      # same workflow succeeds, because a dry run never transfers file contents. Transfer
      # volume and duration are therefore eliminated as causes.
      #
      # THE MOST LIKELY CAUSE, AND WHY IT CANNOT BE CONFIGURED AWAY. These annotations
      # appear on every run:
      #
      #   "Node.js 20 is deprecated. The following actions ... are being forced to run on
      #    Node.js 24: ... SamKirkland/FTP-Deploy-Action@v4.3.5"
      #
      # This action bundles `basic-ftp` 5.x. Node 24.17 binds a resumed TLS session to the
      # host it was authenticated for (the fix for CVE-2026-48934), which broke FTPS data
      # connections in basic-ftp 5.x — hence the alert on the data socket only. basic-ftp
      # only fixed it in 6.0.2, and the LATEST release of this action (v4.4.0) still depends
      # on basic-ftp ^5.0.5, so upgrading the action does not help. There is no input on this
      # action that changes how the TLS session is presented.
      #
      # CONCLUSION: FTPS from a GitHub-hosted runner to this host is not achievable by
      # configuration. Either the transport changes or the deploy becomes manual.
      #
      # WHAT THIS COSTS, STATED PLAINLY. The FTP password and the transferred bytes now cross
      # the network unencrypted. That is a real loss, not a technicality. It is accepted here
      # because the payload is source code and a build artifact — public repository content
      # plus a zip of Composer packages — and because `.env` is EXCLUDED, so the database
      # password, the app key and the staff photographs are never in the transfer at all. The
      # only credential exposed is one FTP account scoped to this application's directory.
      #
      # VERIFIED BEFORE RELYING ON IT: the host accepts a login without TLS. `USER` sent
      # before `AUTH TLS` is answered `331 ... Password required`, so TLS is optional here
      # rather than forced. A host that required TLS would answer with a refusal instead, and
      # this step would fail IMMEDIATELY on authentication rather than part-way through a
      # transfer. That distinction is visible in the log and is worth knowing: an auth error
      # here means stop and upload by hand.
      #
      # `timeout` is raised from the 30-second default: a ~15 MB archive over a shared host's
      # FTP can exceed it.
      #
      # SAFETY: THIS ACTION DELETES REMOTE FILES.
      #
      # It reconciles rather than adds, so anything on the server that is not in the local tree
      # is removed. That is why `vendor/**` is EXCLUDED rather than merely absent locally:
      # excluded paths are skipped in BOTH directions, so the `vendor/` directory unpacked on
      # the server is left alone instead of being deleted as "not in the local tree".
      #
      # The deploy is ARMED rather than automatic. Until the repository variable
      # `FTP_DEPLOY_ENABLED` is exactly `true`, `dry-run` is on: the action connects, compares,
      # and REPORTS what it would change without changing anything.
      #
      # Settings → Secrets and variables → Actions → Variables → New variable
      # ---------------------------------------------------------------
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 300000
          local-dir: ./
          server-dir: ./
          dry-run: ${{ vars.FTP_DEPLOY_ENABLED != 'true' }}

          # ---------------------------------------------------------------
          # EXCLUDE — the most important part of this file.
          #
          # It does two jobs: keeps junk off the server, and protects server state that exists
          # nowhere else, because anything not listed here is DELETED from the server when it
          # is absent locally.
          #
          #   .env                  database password and APP_KEY. Never in the repository, so
          #                         without this the deploy would delete it and the site would
          #                         500. Worse, APP_KEY decrypts the employee IC numbers:
          #                         losing it makes them unreadable for ever.
          #
          #   storage/app/private   the PHOTOGRAPHS — every punch image, stored as files
          #                         outside the web root. Irreplaceable: they are the evidence
          #                         that settles a dispute, and no database backup contains
          #                         them. Also holds the deploy flag.
          #
          #   storage/framework     sessions, compiled views, cache — server state.
          #   storage/logs          the log files.
          #
          # A NOTE ON THE STORAGE DIRECTORY TREE. Excluding these paths means the empty
          # directories are not uploaded either, so a fresh server would have no
          # `storage/framework/views` — and the application then dies with "View path not
          # found", a message that points at views rather than at a missing folder. That was
          # reproduced locally before writing this.
          #
          # It is handled in CODE rather than with glob rules: `attendance:install` and
          # `attendance:deploy` both create the tree when it is absent. Expressing it with `!`
          # negation patterns would depend on this action's exact glob semantics, and relying
          # on an untested assumption for something that breaks the whole site on a fresh
          # install is not a trade worth making.
          # ---------------------------------------------------------------
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/vendor/**
            **/tests/**
            **/scripts/**
            **/docs/**
            **/.github/**
            **/*.md
            phpunit.xml
            .editorconfig
            .gitattributes
            .gitignore
            .npmrc
            package-lock.json
            package.json
            vite.config.js
            storage/app/private/**
            storage/app/*.sqlite*
            storage/logs/**
            storage/framework/**

      # ---------------------------------------------------------------
      # Tell the reader which of the two modes just ran.
      #
      # Without this the step above succeeds either way, and a rehearsal is indistinguishable
      # from a deploy in the Actions UI — which is exactly how somebody concludes the site was
      # updated when nothing was transferred.
      # ---------------------------------------------------------------
      - name: Report
        run: |
          {
            if [ "${{ vars.FTP_DEPLOY_ENABLED }}" = "true" ]; then
              echo "### Deployed"
              echo ""
              echo "Commit \`${{ github.sha }}\` uploaded over FTPS."
              echo ""
              echo "**If this release included a migration, it has NOT been applied yet.**"
              echo "See \`docs/deployment.md\` — drop the deploy flag and the cron entry applies it."
            else
              echo "### Rehearsal only — NOTHING was uploaded"
              echo ""
              echo "\`FTP_DEPLOY_ENABLED\` is not set to \`true\`, so the transfer ran in **dry-run** mode."
              echo ""
              echo "**Read the step log above.** It lists every remote file that would be created"
              echo "or deleted. Confirm the deletions are only files this application owns, then arm it:"
              echo ""
              echo "Settings → Secrets and variables → Actions → Variables → New variable"
              echo "\`FTP_DEPLOY_ENABLED\` = \`true\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
